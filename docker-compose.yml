services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domain}
      POSTGRES_DB: ${POSTGRES_DB:-domain}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domain} -d ${POSTGRES_DB:-domain}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-domain}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-domain}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://domain:domain@postgres:5432/domain}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-domain}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-domain}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-domain_processing}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://domain:domain@postgres:5432/domain}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-domain}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-domain}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-domain_processing}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  rabbitmq_data:
